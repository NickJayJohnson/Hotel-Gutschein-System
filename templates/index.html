<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Willkommen im Hotel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .hero {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 0.5rem;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Grand Hotel & Spa</h1>
        <p>Schenken Sie Unvergessliche Momente mit unseren exklusiven Wertgutscheinen.</p>
        <a href="/shop" class="btn btn-primary">Gutschein kaufen</a>
        <a href="/login" class="btn btn-secondary">Rezeptions-Login</a>
    </div>
</body>
</html>
