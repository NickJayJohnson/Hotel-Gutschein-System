<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezeption Login - Grand Hotel & Spa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Elegantes Hotel-Hintergrundbild mit dunklem Overlay */
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.92)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .hotel-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #d4af37;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #cbd5e0;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

            input:focus {
                outline: none;
                border-color: #d4af37;
                box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
            }

        .login-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

            .login-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
            }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="hotel-brand">Grand Hotel & Spa</h1>
        <div class="subtitle">Rezeptions-Portal</div>

        {% if fehler %}
        <div class="error-message">
            {{ fehler }}
        </div>
        {% endif %}

    <form method="POST" action="/admin/login">
        <label for="username">BENUTZERNAME:</label>
        <input type="text" id="username" name="Benutzername" required value="admin">

        <label for="password">PASSWORT:</label>
        <input type="password" id="password" name="Passwort" required>

        <!-- Den kleinen weißen Button entfernen -->
        <!-- Den gelben Button als type="submit" innerhalb des <form> platzieren: -->
        <button type="submit" class="login-btn">Anmelden</button>
    </form>

        <div class="footer-note">
            Geschützter Bereich • Nur für autorisiertes Personal
        </div>
    </div>

</body>
</html>
